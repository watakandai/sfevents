name: Weekly event fetch

# This is the one piece of this project's deployment that GitHub Actions
# genuinely improves on self-hosting: Actions runners have real outbound
# internet access, so this is where the scraped sources (dothebay, sfrecpark,
# 19hz) actually run against live sites rather than fixtures.
#
# No `pip install` step, deliberately: the CLI, db, models, rankers and all
# five fetchers are pure standard-library Python - including the LLM ranker,
# which talks to the provider over urllib. fastapi/uvicorn in
# requirements.txt are only needed for the local web dashboard.
#
# The events database is CACHED between runs rather than rebuilt. That is
# what makes LLM ranking affordable: scores are keyed by a hash of
# profile.md + model, so a cached database means each weekly run only pays
# to score events it has never seen. Losing the cache is harmless - the next
# run just re-scores everything once.

on:
  schedule:
    - cron: '0 9 * * MON'  # 9am UTC every Monday
    - cron: '0 14 * * FRI' # 2pm UTC Friday = 7am in SF (6am in winter)
  workflow_dispatch:
    inputs:
      provider:
        description: 'LLM ranker provider (blank = use the RANKER_PROVIDER variable)'
        required: false
        type: choice
        options: ['', 'gemini', 'anthropic', 'groq', 'ollama']
        default: ''
      rescore_all:
        description: 'Re-score every event, not just new ones'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Max events to LLM-score this run (blank = RANKER_LIMIT variable, 0 = no limit)'
        required: false
        type: string
        default: ''
  push:
    branches: [main]

permissions:
  contents: write

# One run at a time. Two overlapping runs share one API quota, and the second
# to finish can't push its export (the first moved main) - so it fails before
# saving its database cache, and every score it paid for is lost. Queue instead.
concurrency:
  group: weekly-fetch
  cancel-in-progress: false

jobs:
  fetch-and-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        # pipefail, so `rank ... | tee` still fails when rank does.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Rolling cache: the run-number key never hits, so it always restores
      # the newest previous database via the prefix, and the save step near
      # the end stores a fresh copy under this run's key. Restore and save are
      # split (rather than one actions/cache step) because the combined
      # action only saves when the job succeeds - and a run that goes red
      # for an LLM failure must still keep the scores it did get.
      - name: Restore events database
        uses: actions/cache/restore@v4
        with:
          path: /tmp/events.db
          key: events-db-${{ github.run_number }}
          restore-keys: events-db-

      # The last-resort ranker: a small open model on this runner's own CPU,
      # free (public repo) and immune to provider outages. Installing it and
      # pulling ~3GB of weights takes a couple of minutes, so it happens in
      # the background while fetch and geocode run, and "Wait for Ollama"
      # below collects it. Skipped when no LLM ranking will happen at all.
      - name: Start Ollama in the background
        if: >-
          (inputs.provider || vars.RANKER_PROVIDER) != '' &&
          (contains(vars.RANKER_FALLBACK || 'groq,ollama', 'ollama') ||
           inputs.provider == 'ollama')
        env:
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen3.5:4b' }}
        run: |
          cat > /tmp/ollama-setup.sh <<'SH'
          set -e
          echo "$(date -u +%T) installing"
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer starts a systemd service but returns before it is
          # listening, and `ollama pull` fails outright on a closed port.
          # Wait for it, and start the server by hand if systemd didn't.
          for i in $(seq 30); do
            curl -sf http://127.0.0.1:11434/api/version >/dev/null && break
            [ "$i" = 10 ] && { nohup ollama serve > /tmp/ollama-serve.log 2>&1 & }
            sleep 2
          done
          echo "$(date -u +%T) server up, pulling $OLLAMA_MODEL"
          ollama pull "$OLLAMA_MODEL" 2>&1 | tr '\r' '\n' | grep -v '^pulling.*%' || true
          echo "$(date -u +%T) done"
          SH
          nohup bash /tmp/ollama-setup.sh > /tmp/ollama-setup.log 2>&1 &
          echo "OLLAMA_SETUP_STARTED=1" >> "$GITHUB_ENV"

      # Secret SF publishes events as articles, so its fetcher asks an LLM
      # to pull out dates and venues - Groq first, to leave Gemini's small
      # daily quota to the ranker. Each article is extracted once and cached
      # in the database. Without keys it just returns no new events.
      - name: Fetch events
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u -m sfevents.cli --db /tmp/events.db fetch

      # Coordinates for the calendar's map view. Nominatim asks for no more
      # than one request per second, so this is capped per run and cached in
      # the database by place; a backlog is worked off over several runs
      # rather than hammering a donated service in one go.
      - name: Geocode venues for the map view
        run: |
          python -m sfevents.cli --db /tmp/events.db geocode \
            --limit ${{ vars.GEOCODE_LIMIT || 80 }}

      # Which provider to use is explicit: set the RANKER_PROVIDER repo
      # variable (Settings -> Variables) to gemini or anthropic, and add
      # the matching secret. Left unset, the LLM step
      # is skipped and the site ships heuristic scores only - so a fork with
      # no keys still works.
      - name: Resolve ranker provider
        id: ranker
        env:
          REQUESTED: ${{ inputs.provider || vars.RANKER_PROVIDER }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_GROQ: ${{ secrets.GROQ_API_KEY != '' }}
        run: |
          case "$REQUESTED" in
            ollama)        ;;
            groq)          [ "$HAS_GROQ" = true ] || { echo "::warning::RANKER_PROVIDER=groq but GROQ_API_KEY is not set; skipping LLM rank"; echo "provider=" >> "$GITHUB_OUTPUT"; exit 0; } ;;
            gemini)        [ "$HAS_GEMINI" = true ] || { echo "::warning::RANKER_PROVIDER=gemini but GEMINI_API_KEY is not set; skipping LLM rank"; echo "provider=" >> "$GITHUB_OUTPUT"; exit 0; } ;;
            anthropic)     [ "$HAS_ANTHROPIC" = true ] || { echo "::warning::RANKER_PROVIDER=anthropic but ANTHROPIC_API_KEY is not set; skipping LLM rank"; echo "provider=" >> "$GITHUB_OUTPUT"; exit 0; } ;;
            '')            echo "RANKER_PROVIDER not set - shipping heuristic scores only." ;;
            *)             echo "::warning::unknown RANKER_PROVIDER '$REQUESTED'; skipping LLM rank"; echo "provider=" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "provider=$REQUESTED" >> "$GITHUB_OUTPUT"

      # Only once the model is pulled does OLLAMA_HOST get set - that is
      # what tells the ranker the fallback is usable. If setup failed or is
      # still going after 10 minutes, the ranker skips Ollama, not the run.
      - name: Wait for Ollama
        if: env.OLLAMA_SETUP_STARTED == '1' && steps.ranker.outputs.provider != ''
        env:
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen3.5:4b' }}
        run: |
          for _ in $(seq 120); do
            if curl -sf http://127.0.0.1:11434/api/tags | grep -q "\"$OLLAMA_MODEL\""; then
              echo "OLLAMA_HOST=http://127.0.0.1:11434" >> "$GITHUB_ENV"
              echo "Ollama ready with $OLLAMA_MODEL"
              grep -v '#' /tmp/ollama-setup.log | grep -E '^[0-9]{2}:' || true
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Ollama wasn't ready after 10 minutes; ranking without it"
          grep -v '#' /tmp/ollama-setup.log | tail -20 || true

      # Exactly one of the next two steps runs. `rank --llm` does the
      # heuristic pass itself before calling the provider, so running both
      # would only compute the same scores twice.
      - name: Rank (heuristic only)
        if: steps.ranker.outputs.provider == ''
        run: python -m sfevents.cli --db /tmp/events.db rank

      # Allowed to fail so the export below still ships whatever did get
      # scored; the "Alert" step at the end turns the run red afterwards.
      # `rank --llm` exits non-zero whenever any event was left unscored
      # (a 503, a quota, a reset connection), not just on a crash.
      - name: Rank against profile.md with an LLM
        id: llm
        if: steps.ranker.outputs.provider != ''
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen3.5:4b' }}
          PROVIDER: ${{ steps.ranker.outputs.provider }}
          # Tried in order for whatever PROVIDER leaves unscored (Gemini's
          # "high demand" 503s). Groq is free with no card: add GROQ_API_KEY
          # as a secret. Ollama is the runner-local model started above. A
          # fallback without a key/server is skipped, not fatal. Batch sizes
          # and spacing are their own - see rank.FALLBACK_PACING.
          FALLBACK: ${{ vars.RANKER_FALLBACK || 'groq,ollama' }}
          RESCORE_ALL: ${{ inputs.rescore_all }}
          # A manual run's `limit` input wins over the variable, so a one-off
          # "score everything" run doesn't mean editing repo settings.
          LIMIT: ${{ inputs.limit != '' && inputs.limit || vars.RANKER_LIMIT }}
          # Gemini's free tier counts requests, not events, against a small
          # daily quota - so send many events per request, and space requests
          # out to stay under the per-minute limit rather than bump into it.
          BATCH_SIZE: ${{ vars.RANKER_BATCH_SIZE || 50 }}
          MIN_INTERVAL: ${{ vars.RANKER_MIN_INTERVAL || 15 }}
        run: |
          args=(--provider "$PROVIDER" --fallback "$FALLBACK" --batch-size "$BATCH_SIZE" --min-interval "$MIN_INTERVAL")
          [ "$RESCORE_ALL" = true ] && args+=(--rescore-all)
          if [ -n "$LIMIT" ]; then
            case "$LIMIT" in
              *[!0-9]*) echo "::error::limit must be a whole number, got '$LIMIT'"; exit 1 ;;
            esac
            args+=(--limit "$LIMIT")
          fi
          # -u: unbuffered, or stdout (the batches) lands in the log after
          # stderr (the verdict) and the log reads backwards.
          python -u -m sfevents.cli --db /tmp/events.db rank --llm "${args[@]}" 2>&1 | tee /tmp/rank.log

      - name: Export to static JSON
        run: |
          python -m sfevents.cli --db /tmp/events.db export \
            --out docs/data/events.json --sort score

      - name: Commit and push if the export changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Event data refresh'
          file_pattern: docs/data/events.json docs/data/meta.json

      - name: Save events database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/events.db
          key: events-db-${{ github.run_number }}

      # The alert. A red scheduled run emails whoever last edited the cron
      # line (GitHub's default Actions notification), and the summary shows
      # on the run page. Everything above has already shipped by now.
      - name: Alert if LLM ranking failed
        if: steps.llm.outcome == 'failure'
        run: |
          {
            echo "## LLM ranking failed"
            echo
            echo "The site shipped, but some events kept heuristic scores only. They'll be retried next run."
            echo
            echo '```'
            grep -E "llm:|batch [0-9]+" /tmp/rank.log | cut -c1-200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=LLM ranking failed::$(grep -E '^llm: (FAILED|SKIPPED)' /tmp/rank.log | tail -1)"
          exit 1
